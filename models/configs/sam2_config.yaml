# SAM-2 (Segment Anything Model 2) Encoder Multi-Label Classification Configuration
# Uses SAM-2's Hiera vision encoder for feature extraction

# 1. Model Configuration
model:
  name: sam2-hiera-base-plus
  pretrained_model_id: facebook/sam2-hiera-base-plus
  num_labels: 5  # has_step, has_movable_chair, has_high_chair, has_fixed_chair, has_floor_chair

# 2. ML-Decoder Configuration
ml_decoder:
  enabled: false
  num_queries: 5
  num_layers: 1
  num_heads: 8
  dim_feedforward: 2048
  dropout: 0.3
  normalize_before: false
  return_intermediate: false

# 2-1. CSRA Configuration
csra:
  enabled: false
  num_heads: 4
  lam: 0.1
  temperatures: [1.0, 2.0, 4.0, 6.0]
  dropout: 0.1

# 2-2. Q2L Configuration
q2l:
  enabled: false
  num_layers: 2
  num_heads: 8
  dim_feedforward: 2048
  dropout: 0.1
  use_pos_encoding: true

# 3. Data Configuration
data:
  train_ann_file: "train_images/train_annotation.json"
  train_img_dir: "train_images/images"
  val_ann_file: "train_images/val_annotation.json"
  val_img_dir: "train_images/images"

# 4. Augmentation Configuration
augmentations:
  enabled: true
  train:
    - name: HorizontalFlip
      params:
        p: 0.5
    - name: RandomBrightnessContrast
      params:
        p: 0.3
        brightness_limit: 0.2
        contrast_limit: 0.2
    - name: ColorJitter
      params:
        p: 0.3
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.1
    - name: Affine
      params:
        p: 0.3
        translate_percent: 0.1
        scale: [0.9, 1.1]
        rotate: [-15, 15]
  val:
    []

# 5. Training Configuration
training:
  epochs: 60
  batch_size: 8  # Reduced for memory efficiency
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-5
  vision_encoder_lr: 5.0e-7  # Low LR for SAM2 encoder
  classifier_lr: 2.5e-4
  min_lr: 1.0e-7
  weight_decay: 0.05
  warmup_epochs: 3
  max_grad_norm: 1.0
  early_stopping_patience: 8
  device: cuda
  freeze_vision_encoder: false

  best_metric: "mAP_macro"

  loss:
    type: "asl"
    params:
      gamma_neg: 4
      gamma_pos: 1
      clip: 0.05

  optimizer:
    type: "adamw"
    betas: [0.9, 0.999]
    eps: 0.00000001

  scheduler:
    type: "cosine_annealing"
    step_per_batch: true

# 6. Output Configuration
output:
  log_dir: "outputs/logs"
  checkpoint_dir: "models/checkpoints"

# 7. Evaluation Metrics
metrics:
  threshold: 0.5
