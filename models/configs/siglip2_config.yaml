# SigLIP2 Multi-Label Classification Configuration

# 1. Model Configuration
model:
  name: siglip2-base-patch16-224
  pretrained_model_id: google/siglip2-base-patch16-224
  num_labels: 5  # has_step, has_movable_chair, has_high_chair, has_fixed_chair, has_floor_chair

# 2. ML-Decoder Configuration
ml_decoder:
  enabled: false  # Set to true to use ML Decoder (use --use-mldecoder flag)
  num_queries: 5  # Same as num_labels (one query per class)
  num_layers: 1  # Number of transformer decoder layers (1 or 2 recommended)
  num_heads: 8  # Number of attention heads
  dim_feedforward: 2048  # Dimension of feedforward network
  dropout: 0.2  # Dropout rate (increased to prevent overfitting)
  normalize_before: false  # Pre-norm or post-norm
  return_intermediate: false  # Return intermediate layer outputs

# 2-1. CSRA (Class-Specific Residual Attention) Configuration
csra:
  enabled: false  # Set to true to use CSRA (use --use-csra flag)
  num_heads: 4  # Number of CSRA heads with different temperatures
  lam: 0.1  # Residual weight (balance between attention and average pooling)
  temperatures: [1.0, 2.0, 4.0, 6.0]  # Temperature for each head
  dropout: 0.1  # Dropout rate before CSRA heads

# 2-2. Q2L (Query2Label) Configuration
q2l:
  enabled: false  # Set to true to use Q2L (use --use-q2l flag)
  num_layers: 2  # Number of transformer decoder layers
  num_heads: 8  # Number of attention heads
  dim_feedforward: 2048  # Dimension of feedforward network
  dropout: 0.1  # Dropout rate
  use_pos_encoding: true  # Whether to use positional encoding for image features

# 3. Data Configuration
data:
  train_ann_file: "train_images/train_annotation.json"
  train_img_dir: "train_images/images"
  val_ann_file: "train_images/val_annotation.json"
  val_img_dir: "train_images/images"

# 4. Augmentation Configuration
augmentations:
  enabled: true
  train:
    - name: HorizontalFlip
      params:
        p: 0.5
    - name: RandomBrightnessContrast
      params:
        p: 0.3
        brightness_limit: 0.2
        contrast_limit: 0.2
    - name: ColorJitter
      params:
        p: 0.3
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.1
    - name: Affine
      params:
        p: 0.3
        translate_percent: 0.1
        scale: [0.9, 1.1]
        rotate: [-15, 15]
  val:
    []  # No augmentation for validation

# 5. Training Configuration
training:
  epochs: 60              # 로그 기준 6에 성능 정점이 나와 총 에폭 단축
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-5  # 성능 향상 시도: base LR 소폭 증가
  vision_encoder_lr: 2.0e-6  # Lower LR for pretrained vision encoder (when using differential LR)
  classifier_lr: 1.5e-4  # Head LR 약간 상향해 수렴 가속
  min_lr: 1.0e-7
  weight_decay: 0.02
  warmup_epochs: 8        # 초기 10→3: 빠른 워밍업 후 본 학습 진입
  max_grad_norm: 1.0
  early_stopping_patience: 8   # 성능 정체 구간이 길어지기 전에 종료
  device: cuda
  freeze_vision_encoder: false  # Use differential LR instead of freezing

  # Best model & early stopping criterion
  best_metric: "mAP_macro"  # Options: "loss", "f1_micro", "f1_macro", "mAP_macro", "mAP_micro", "subset_accuracy", "hamming_accuracy"

  # Loss Configuration
  loss:
    type: "asl"  # 'asl' or 'bce'
    params:
      # ASL (Asymmetric Loss) - 클래스 불균형에 강함 (추천!)
      gamma_neg: 3    # Negative samples focusing
      gamma_pos: 1    # Positive samples focusing
      clip: 0.05      # Probability margin

  optimizer:
    type: "adamw"
    betas: [0.9, 0.999]
    eps: 0.00000001

  scheduler:
    type: "cosine_annealing"
    step_per_batch: true

# 6. Output Configuration
output:
  log_dir: "outputs/logs"
  checkpoint_dir: "models/checkpoints"

# 7. Evaluation Metrics
metrics:
  threshold: 0.5  # Sigmoid threshold for prediction (메트릭 계산은 코드에서 고정)
